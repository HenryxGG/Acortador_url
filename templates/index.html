<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acortador de Enlaces | Portafolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Contenido principal -->
    <main class="container mx-auto px-4 py-16 flex flex-col items-center justify-center flex-grow">
        
        <div class="text-center max-w-xl mx-auto mb-10">
            <span class="bg-indigo-500/10 text-indigo-400 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider border border-indigo-500/20">Proyecto de Portafolio</span>
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight mt-3 mb-4">Acorta tus links al instante</h1>
            <p class="text-slate-400 text-base sm:text-lg">Pega tu enlace largo y conviértelo en un enlace limpio, corto y listo para compartir.</p>
        </div>

        <!-- Tarjeta del formulario -->
        <div class="w-full max-w-md bg-slate-800 border border-slate-700/60 rounded-2xl shadow-xl p-6 sm:p-8">
            
            {% if error %}
            <div class="mb-4 bg-red-500/10 border border-red-500/30 text-red-400 text-sm p-3 rounded-lg text-center">
                {{ error }}
            </div>
            {% endif %}

            <form action="/" method="POST" class="space-y-4">
                <div>
                    <label for="url_larga" class="block text-sm font-medium text-slate-300 mb-2">URL Larga</label>
                    <input type="url" name="url_larga" id="url_larga" required 
                           placeholder="https://ejemplo.com/mi-articulo-muy-largo..." 
                           class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                </div>

                <!-- NUEVO: Campo para alias personalizado -->
                <div>
                    <label for="alias" class="block text-sm font-medium text-slate-300 mb-2">Alias Personalizado <span class="text-slate-500 text-xs">(Opcional)</span></label>
                    <input type="text" name="alias" id="alias" 
                           placeholder="ej. mi-proyecto-web" 
                           class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                </div>

                <button type="submit" 
                        class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200">
                    Acortar Enlace
                </button>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-800">
        Desarrollado con Flask y Python • Desplegado en Vercel
    </footer>

</body>
</html>
