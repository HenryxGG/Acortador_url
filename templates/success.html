<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Enlace Acortado Exitosamente! | Portafolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Contenido principal -->
    <main class="container mx-auto px-4 py-16 flex flex-col items-center justify-center flex-grow">
        
        <div class="w-full max-w-md bg-slate-800 border border-slate-700/60 rounded-2xl shadow-xl p-6 sm:p-8 text-center">
            
            <div class="w-12 h-12 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                ✓
            </div>

            <h2 class="text-2xl font-bold mb-2">¡Enlace acortado!</h2>
            <p class="text-slate-400 text-sm mb-6">Tu enlace corto está listo para ser compartido.</p>

            <!-- Caja del enlace corto -->
            <div class="mb-6 text-left">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Enlace Corto</label>
                <div class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-xl p-2">
                    <input type="text" id="linkCortoInput" value="{{ link_corto }}" readonly 
                           class="w-full bg-transparent px-2 text-indigo-400 font-medium focus:outline-none text-sm truncate">
                    <button onclick="copiarAlPortapapeles()" id="btnCopiar"
                            class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition shrink-0">
                        Copiar
                    </button>
                </div>
            </div>

            <!-- Enlace original de referencia -->
            <div class="mb-6 text-left bg-slate-900/50 p-3 rounded-xl border border-slate-800">
                <span class="block text-xs text-slate-500 font-medium mb-1">URL Original:</span>
                <p class="text-xs text-slate-400 truncate">{{ url_larga }}</p>
            </div>

            <!-- Botón para volver -->
            <a href="/" class="block w-full py-3 px-4 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded-xl transition duration-200 text-sm">
                Acortar otro enlace
            </a>
        </div>

    </main>

    <!-- Script para copiar al portapapeles -->
    <script>
        function copiarAlPortapapeles() {
            const input = document.getElementById('linkCortoInput');
            input.select();
            input.setSelectionRange(0, 99999); // Para dispositivos móviles
            navigator.clipboard.writeText(input.value);

            const btn = document.getElementById('btnCopiar');
            btn.textContent = '¡Copiado!';
            btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500');
            btn.classList.add('bg-emerald-600');

            setTimeout(() => {
                btn.textContent = 'Copiar';
                btn.classList.remove('bg-emerald-600');
                btn.classList.add('bg-indigo-600', 'hover:bg-indigo-500');
            }, 2000);
        }
    </script>

</body>
</html>
